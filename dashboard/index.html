<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token launch radar: protocols that record no token, ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<header class="top">
  <div class="intro">
    <h1>Token launch radar</h1>
    <p id="sub" class="muted"></p>
    <div class="tabs" id="tabs" role="group" aria-label="Board view"></div>
  </div>
  <figure class="scope" id="scopebox">
    <div id="scope" role="img" aria-label="Radar scope: every ranked protocol as a dot, distance from the centre is implied value, direction is category"></div>
    <figcaption class="muted">Distance from the centre is implied value, direction is category, colour is confidence. Click a dot to open it.</figcaption>
  </figure>
</header>
<main class="layout">
  <section class="pane" aria-label="Board">
    <form id="filters" class="filters" autocomplete="off" aria-label="Filters"></form>
    <p id="count" class="muted count" aria-live="polite"></p>
    <div class="tablewrap" id="board" tabindex="-1"></div>
  </section>
  <aside id="detail" class="detail" aria-label="Protocol detail" aria-live="polite"></aside>
</main>
<section id="method" class="method" aria-label="How the value is built"></section>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
